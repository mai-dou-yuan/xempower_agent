[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxing-judge-agent"
version = "0.1.0"
description = "Evidence-grounded, non-official boxing score estimator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pandas>=2.2,<4",
  "openai>=1.70,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[project.scripts]
boxing-judge-agent = "boxing_judge_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boxing_judge_agent = ["frontend.html", "frontend.css", "frontend.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
